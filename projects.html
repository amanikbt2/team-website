<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore student focused projects by Kibet's Team."
    />
    <title>Projects | Kibet's Team</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Kibet's Team<span>.</span></a
        ><button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          Menu
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Main">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html" aria-current="page">Projects</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
        <button class="theme-toggle" type="button" aria-pressed="false">
          Dark mode
        </button>
      </div>
    </header>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">MADE FOR STUDENTS</p>
          <h1>Projects with a purpose.</h1>
          <p class="lead">
            A collection of ideas we’re learning to bring to life.
          </p>
        </div>
      </section>
      <section class="container section" aria-labelledby="project-heading">
        <div class="section-heading">
          <p class="eyebrow">OUR WORK</p>
          <h2 id="project-heading">Browse projects</h2>
        </div>
        <label class="search-label" for="project-search">Search projects</label
        ><input
          id="project-search"
          class="search-input"
          type="search"
          placeholder="Try “events” or “study”"
          autocomplete="off"
        />
        <div
          class="filter-bar"
          role="group"
          aria-label="Filter projects by category"
        >
          <button
            class="filter-button is-active"
            type="button"
            data-filter="all"
            aria-pressed="true"
          >
            All</button
          ><button
            class="filter-button"
            type="button"
            data-filter="campus-life"
            aria-pressed="false"
          >
            Campus life</button
          ><button
            class="filter-button"
            type="button"
            data-filter="productivity"
            aria-pressed="false"
          >
            Productivity</button
          ><button
            class="filter-button"
            type="button"
            data-filter="learning"
            aria-pressed="false"
          >
            Learning
          </button>
        </div>
        <p id="project-count" class="result-count" aria-live="polite"></p>
        <div id="project-grid" class="project-grid"></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year">2026</span> Kibet's Team</p>
        <a href="contact.html">Say hello <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </body>
</html>
